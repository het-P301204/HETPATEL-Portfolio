<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Art direction comparison — four homepages</title>
<style>
  :root{--w:1280px}
  *{box-sizing:border-box}
  body{margin:0;background:#191919;color:#EDEDED;font:14px/1.5 ui-sans-serif,system-ui,sans-serif}
  header{padding:18px 22px;border-bottom:1px solid #2E2E2E;position:sticky;top:0;background:#191919;z-index:10;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.02em}
  .ctl{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  button{background:#262626;color:#EDEDED;border:1px solid #3A3A3A;padding:6px 11px;border-radius:5px;font:inherit;font-size:12px;cursor:pointer}
  button.on{background:#EDEDED;color:#191919;border-color:#EDEDED}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:#2E2E2E}
  @media(max-width:1100px){.grid{grid-template-columns:1fr}}
  .cell{background:#191919;padding:14px}
  .cap{display:flex;gap:10px;align-items:baseline;margin-bottom:10px}
  .tag{font:600 12px ui-monospace,monospace;background:#EDEDED;color:#191919;padding:2px 7px;border-radius:3px}
  .nm{font-weight:600}
  .desc{color:#9A9A9A;font-size:12px}
  .vp{position:relative;overflow:hidden;border:1px solid #2E2E2E;border-radius:6px;background:#fff}
  .vp iframe{border:0;width:var(--w);height:2400px;transform-origin:0 0;display:block}
  a.open{color:#8AB4FF;font-size:12px;margin-left:auto;text-decoration:none}
</style>
</head>
<body>
<header>
  <h1>Four art directions — homepage</h1>
  <div class="ctl">
    <span style="color:#9A9A9A;font-size:12px">viewport</span>
    <button data-w="375">375</button>
    <button data-w="768">768</button>
    <button data-w="1024">1024</button>
    <button data-w="1280" class="on">1280</button>
    <button data-w="1440">1440</button>
  </div>
</header>

<div class="grid" id="grid"></div>

<script>
const DIRS = [
  ['A','SIGNAL','a-signal.html','Dark premium / technical instrument. Geist + Geist Mono.'],
  ['B','LEDGER','b-ledger.html','Editorial-technical, light, persistent left rail. Instrument Serif + Inter.'],
  ['C','FIELD','c-field.html','Refined monochrome, oversized stacked wordmark. Inter Tight.'],
  ['D','CASEFILE','d-casefile.html','Evidence-led, density-rich, identity compressed. Space Grotesk + JetBrains Mono.'],
];
const grid = document.getElementById('grid');
DIRS.forEach(([k,name,file,desc])=>{
  const cell=document.createElement('div');cell.className='cell';
  cell.innerHTML=`<div class="cap"><span class="tag">${k}</span><span class="nm">${name}</span>
    <a class="open" href="${file}" target="_blank">open full →</a></div>
    <div class="desc" style="margin-bottom:9px">${desc}</div>
    <div class="vp"><iframe src="${file}" loading="lazy"></iframe></div>`;
  grid.appendChild(cell);
});

function setW(w){
  document.documentElement.style.setProperty('--w',w+'px');
  document.querySelectorAll('.vp').forEach(vp=>{
    const f=vp.querySelector('iframe');
    const s=vp.clientWidth/w;
    f.style.transform='scale('+s+')';
    vp.style.height=(2400*s)+'px';
  });
}
document.querySelectorAll('button[data-w]').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('button[data-w]').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); setW(+b.dataset.w);
  };
});
addEventListener('resize',()=>setW(+document.querySelector('button.on').dataset.w));
addEventListener('load',()=>setTimeout(()=>setW(1280),150));
setTimeout(()=>setW(1280),400);
</script>
</body>
</html>
